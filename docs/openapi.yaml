              type: 'null'
    LatestMetric:
      type: object
      additionalProperties: false
      required:
      - metric
      - latestMeasurement
      - latestKnownMeasurement
      - latestReceivedMeasurement
      - quality
      - latestReceivedQuality
      properties:
        metric:
          $ref: '#/components/schemas/Metric'
        latestMeasurement:
          description: Latest by effective UTC milliseconds/id; null if this metric has no rows.
          anyOf:
          - $ref: '#/components/schemas/Measurement'
          - type: 'null'
        latestKnownMeasurement:
          description: Latest known measuredAt by UTC milliseconds/id, independently of arrival order; null if
            none.
          anyOf:
          - allOf:
            - $ref: '#/components/schemas/Measurement'
            - properties:
                measuredAt:
                  type: string
                timeBasis:
                  const: measuredAt
          - type: 'null'
        latestReceivedMeasurement:
          description: Latest by receipt UTC milliseconds/id; may have unknown measurement time. Null if none.
          anyOf:
          - $ref: '#/components/schemas/Measurement'
          - type: 'null'
        quality:
          $ref: '#/components/schemas/MeasurementQuality'
          description: Latest known measurement, or latest received only when none known.
        latestReceivedQuality:
          $ref: '#/components/schemas/MeasurementQuality'
          description: Most recently received measurement, independently.
    LatestMeasurements:
