            freshForSeconds: 3600
            ageSeconds: null
            clockSkew: false
          latestReceivedQuality:
            status: missing
            measurementId: null
            freshForSeconds: 3600
            ageSeconds: null
            clockSkew: false
        - metric: diastolicPressure
          quality:
            status: missing
            measurementId: null
            freshForSeconds: 3600
            ageSeconds: null
            clockSkew: false
          latestReceivedQuality:
            status: missing
            measurementId: null
            freshForSeconds: 3600
            ageSeconds: null
            clockSkew: false
        - metric: temperature
          quality:
            status: missing
            measurementId: null
            freshForSeconds: 3600
            ageSeconds: null
            clockSkew: false
          latestReceivedQuality:
            status: missing
            measurementId: null
            freshForSeconds: 3600
            ageSeconds: null
            clockSkew: false
        - metric: sleepHours
