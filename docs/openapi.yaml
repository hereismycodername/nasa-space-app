            status: missing
            measurementId: null
            freshForSeconds: 86400
            ageSeconds: null
            clockSkew: false
          latestReceivedQuality:
            status: missing
            measurementId: null
            freshForSeconds: 86400
            ageSeconds: null
            clockSkew: false
        - metric: mood
          quality:
            status: missing
            measurementId: null
            freshForSeconds: 86400
            ageSeconds: null
            clockSkew: false
          latestReceivedQuality:
            status: missing
            measurementId: null
            freshForSeconds: 86400
            ageSeconds: null
            clockSkew: false
    MissionDate:
      type: string
      format: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      description: Valid canonical calendar date YYYY-MM-DD, without time or offset.
      example: '2026-11-13'
    Task:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - completedAt
      properties:
        id:
          type: string
        title:
          type: string
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: First server UTC completion timestamp for this mission date, or null.
    TasksResponse:
      type: object
      additionalProperties: false
      required:
      - missionDate
      - tasks
      properties:
        missionDate:
          $ref: '#/components/schemas/MissionDate'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
    TaskUpdateResponse:
      type: object
      additionalProperties: false
      required:
      - missionDate
      - id
      - title
      - completedAt
      properties:
        missionDate:
          $ref: '#/components/schemas/MissionDate'
        id:
          type: string
        title:
          type: string
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: First server UTC completion timestamp for this mission date, or null.
    TaskUpdate:
      type: object
      additionalProperties: false
      required:
      - missionDate
      - completed
      properties:
        missionDate:
          $ref: '#/components/schemas/MissionDate'
        completed:
          type: boolean
          description: true creates a mark only if missing; false clears only this date's mark.
    Problem:
      type: object
      description: Problem Details for API errors, including JSON/query/path extraction. code is stable
        for client branching; message/detail/error may be improved. error is retained as a legacy alias.
        Static asset errors are outside this contract.
      required:
      - type
      - title
      - status
      - detail
      - code
      - message
      - error
      properties:
        type:
          type: string
          format: uri
          description: 'Stable URN: urn:space-health:error: followed by lowercase hyphenated code.'
        title:
          type: string
          description: Canonical HTTP status reason.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Same value as message.
        code:
          type: string
          enum:
          - INVALID_JSON
          - INVALID_BODY
          - UNSUPPORTED_MEDIA_TYPE
          - PAYLOAD_TOO_LARGE
          - INVALID_QUERY
          - INVALID_PATH
          - VALIDATION_ERROR
          - UNKNOWN_DEVICE
          - SEQUENCE_CONFLICT
          - TASK_NOT_FOUND
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - DATABASE_ERROR
        message:
          type: string
        field:
          type: string
          description: Optional camelCase request field, when known.
        error:
          type: string
          deprecated: true
          description: Legacy alias of message. Kept for compatibility; do not use for machine branching.
      example:
        type: urn:space-health:error:validation-error
        title: Bad Request
        status: 400
        detail: Invalid unit or value
        code: VALIDATION_ERROR
        message: Invalid unit or value
        field: unit
        error: Invalid unit or value
  responses:
    BadRequest:
      description: 'Malformed JSON/query/path or invalid input. Codes depend on the operation: INVALID_JSON,
        INVALID_QUERY, INVALID_PATH, VALIDATION_ERROR, UNKNOWN_DEVICE.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              externalValue: ./examples/validation-error.response.json
    InvalidBody:
      description: '422 INVALID_BODY: valid JSON cannot be decoded into the request DTO (missing/unknown
        fields, wrong types, out-of-range integer).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: '413 PAYLOAD_TOO_LARGE: request body exceeds the default 2 MiB limit.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: '415 UNSUPPORTED_MEDIA_TYPE: missing or unsupported JSON Content-Type.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 404 TASK_NOT_FOUND or NOT_FOUND.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    SequenceConflict:
      description: '409 SEQUENCE_CONFLICT: existing message key has different metric, value, unit or measuredAt.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MethodNotAllowed:
      description: '405 METHOD_NOT_ALLOWED: the resource does not support this method.'
      content:
