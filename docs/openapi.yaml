        evaluatedAt: '2026-11-13T08:00:03Z'
      required:
      - astronautId
      - metrics
      - evaluatedAt
      properties:
        astronautId:
          type: string
          const: demo-astronaut
          description: Server-selected demo profile. No astronautId query selector or authentication is provided.
        metrics:
          type: array
          oneOf:
          - title: Current twelve-metric registry
            minItems: 12
            maxItems: 12
          - title: Legacy six-metric registry
            minItems: 6
            maxItems: 6
            items:
              properties:
                metric:
                  enum: [heartRate, systolicPressure, diastolicPressure, temperature, sleepHours, mood]
          description: Current servers return twelve metrics in fixed registry order heartRate, systolicPressure,
            diastolicPressure, temperature, sleepHours, mood, spo2, glucose, visionBlur, exerciseMinutes, headache,
            backPain. The six-item alternative documents older servers and retained legacy examples only;
            it contains the original first six metrics. Clients discover supported metrics from this response.
          items:
            $ref: '#/components/schemas/LatestMetric'
        evaluatedAt:
          type: string
          format: date-time
          description: One server UTC RFC3339 instant for every quality calculation in this response.
    MeasurementQuality:
      type: object
      additionalProperties: false
      description: Operational demo quality, not a medical threshold. Exact age through the window inclusive is
        fresh; +1 ns is stale. Any future parsed instant, including +1 ns, is clockSkew. Raw timestamps are never
        replaced. After server-clock rollback, previously accepted data remains clockSkew even when more than 300
        seconds ahead.
      required:
      - status
      - measurementId
      - freshForSeconds
      - ageSeconds
      - clockSkew
      properties:
        status:
          type: string
          enum:
          - missing
          - fresh
          - stale
          - unknownTime
          - clockSkew
        measurementId:
          type:
          - string
          - 'null'
          minLength: 1
          description: Selected measurement id; null only for missing.
        freshForSeconds:
          type: integer
          enum:
          - 15
          - 60
          - 3600
          - 86400
          description: 'Demo policy in seconds: heartRate 15; spo2 60; both pressures, temperature, glucose, headache
            and backPain 3600; sleepHours, mood, visionBlur and exerciseMinutes 86400. These operational
            freshness windows are not medical thresholds.'
        ageSeconds:
          type:
          - number
          - 'null'
          minimum: 0
          description: Fractional age for known nonfuture times; null for missing, unknownTime and clockSkew. Exact
            duration determines status before floating-point serialization.
        clockSkew:
          type: boolean
          description: True exactly when status is clockSkew.
      allOf:
      - if:
          properties:
            status:
              const: missing
          additionalProperties: true
        then:
          properties:
            measurementId:
              type: 'null'
          additionalProperties: true
        else:
          properties:
            measurementId:
              type: string
          additionalProperties: true
      - if:
          properties:
            status:
              enum:
              - fresh
              - stale
          additionalProperties: true
        then:
          properties:
            ageSeconds:
              type: number
          additionalProperties: true
        else:
          properties:
            ageSeconds:
              type: 'null'
          additionalProperties: true
      - if:
          properties:
            status:
              const: clockSkew
          additionalProperties: true
        then:
          properties:
            clockSkew:
              const: true
          additionalProperties: true
        else:
          properties:
            clockSkew:
              const: false
          additionalProperties: true
    MetricQuality:
      type: object
      additionalProperties: false
      required:
      - metric
      - quality
      - latestReceivedQuality
      properties:
        metric:
          $ref: '#/components/schemas/Metric'
        quality:
          $ref: '#/components/schemas/MeasurementQuality'
          description: Latest known measurement, or latest received when none known.
        latestReceivedQuality:
          $ref: '#/components/schemas/MeasurementQuality'
          description: Most recently received measurement independently.
    SeriesTimeBasis:
      type: [string, 'null']
      enum: [measuredAt, receivedAt, mixed, null]
      description: All rows in the interval or range, not only the selected last row. measuredAt when
        all times are known; receivedAt when all are unknown; mixed when both occur; null with no rows.
        Receipt time does not establish measurement freshness.
    SeriesPoint:
      type: object
      additionalProperties: false
      required: [startAt, endAt, value, min, max, count, measuredCount, receivedCount, timeBasis]
      properties:
        startAt:
          type: string
          format: date-time
          description: Inclusive UTC start, normalized with millisecond precision and Z suffix.
        endAt:
          type: string
          format: date-time
          description: Exclusive UTC end, normalized with millisecond precision and Z suffix; final bucket is clipped to to.
        value:
          type: [number, 'null']
          description: Arithmetic mean or last value according to aggregation; null only for an empty bucket.
        min:
          type: [number, 'null']
          description: Minimum for a nonempty mean bucket; null for last aggregation or an empty bucket.
        max:
          type: [number, 'null']
          description: Maximum for a nonempty mean bucket; null for last aggregation or an empty bucket.
        count:
          type: integer
          format: int64
          minimum: 0
          description: Every matching row, including for last aggregation; measuredCount + receivedCount equals count.
        measuredCount:
          type: integer
          format: int64
          minimum: 0
          description: Rows positioned by known measuredAt.
        receivedCount:
          type: integer
          format: int64
          minimum: 0
          description: Rows with unknown measuredAt positioned by receivedAt.
        timeBasis:
          $ref: '#/components/schemas/SeriesTimeBasis'
      allOf:
      - if:
          properties:
            count: {const: 0}
        then:
          additionalProperties: true
          properties:
            value: {type: 'null'}
            min: {type: 'null'}
            max: {type: 'null'}
            measuredCount: {const: 0}
            receivedCount: {const: 0}
            timeBasis: {type: 'null'}
        else:
          additionalProperties: true
          properties:
            value: {type: number}
            timeBasis: {type: string}
      - if:
          properties:
            timeBasis: {const: measuredAt}
        then:
          additionalProperties: true
          properties:
            measuredCount: {minimum: 1}
            receivedCount: {const: 0}
      - if:
          properties:
            timeBasis: {const: receivedAt}
        then:
          additionalProperties: true
          properties:
            measuredCount: {const: 0}
            receivedCount: {minimum: 1}
      - if:
          properties:
            timeBasis: {const: mixed}
        then:
          additionalProperties: true
          properties:
            measuredCount: {minimum: 1}
            receivedCount: {minimum: 1}
    MeasurementSeries:
      type: object
      additionalProperties: false
      required: [astronautId, metric, unit, aggregation, from, to, intervalMs, timeBasis, points]
      example:
        astronautId: demo-astronaut
        metric: heartRate
        unit: bpm
        aggregation: mean
        from: '2026-11-13T08:00:00.000Z'
        to: '2026-11-13T08:00:01.000Z'
        intervalMs: 1000
        timeBasis: null
        points:
        - startAt: '2026-11-13T08:00:00.000Z'
          endAt: '2026-11-13T08:00:01.000Z'
          value: null
          min: null
          max: null
          count: 0
          measuredCount: 0
          receivedCount: 0
          timeBasis: null
      properties:
        astronautId:
          type: string
          const: demo-astronaut
        metric:
          $ref: '#/components/schemas/Metric'
        unit:
          $ref: '#/components/schemas/Unit'
        aggregation:
          type: string
          enum: [mean, last]
          description: Mean for heartRate, systolicPressure, diastolicPressure, temperature, spo2 and glucose;
            last for sleepHours, mood, visionBlur, exerciseMinutes, headache and backPain.
        from:
          type: string
          format: date-time
          description: Requested inclusive boundary normalized to UTC with milliseconds and Z suffix.
        to:
          type: string
          format: date-time
          description: Requested exclusive boundary normalized to UTC with milliseconds and Z suffix.
        intervalMs:
          type: integer
          format: int64
          minimum: 1
          description: max(1, ceil((to - from) / maxPoints)), in whole UTC milliseconds.
        timeBasis:
          $ref: '#/components/schemas/SeriesTimeBasis'
        points:
          type: array
          minItems: 1
          maxItems: 500
          description: Contiguous ascending UTC intervals covering [from,to), including empty buckets.
            Length is ceil((to - from) / intervalMs), at most the requested maxPoints.
          items:
            $ref: '#/components/schemas/SeriesPoint'
      allOf:
      - if:
          properties:
            metric: {enum: [sleepHours, mood, visionBlur, exerciseMinutes, headache, backPain]}
        then:
          additionalProperties: true
          properties:
            aggregation: {const: last}
            points:
              items:
                properties:
                  min: {type: 'null'}
                  max: {type: 'null'}
        else:
          additionalProperties: true
          properties:
            aggregation: {const: mean}
            points:
              items:
                if:
                  additionalProperties: true
                  properties:
                    count: {minimum: 1}
                then:
                  additionalProperties: true
                  properties:
                    min: {type: number}
                    max: {type: number}
      - if:
          properties:
            metric: {const: heartRate}
        then:
          additionalProperties: true
          properties:
            unit: {const: bpm}
      - if:
          properties:
            metric: {enum: [systolicPressure, diastolicPressure]}
        then:
          additionalProperties: true
          properties:
            unit: {const: mmHg}
      - if:
          properties:
            metric: {const: temperature}
        then:
          additionalProperties: true
          properties:
            unit: {const: °C}
      - if:
          properties:
            metric: {const: sleepHours}
        then:
          additionalProperties: true
          properties:
            unit: {const: h}
      - if:
          properties:
            metric: {enum: [mood, visionBlur, headache, backPain]}
        then:
          additionalProperties: true
          properties:
            unit: {const: score}
      - if:
          properties:
            metric: {const: spo2}
        then:
          additionalProperties: true
          properties:
            unit: {const: '%'}
      - if:
          properties:
            metric: {const: glucose}
        then:
          additionalProperties: true
          properties:
            unit: {const: mg/dL}
      - if:
          properties:
            metric: {const: exerciseMinutes}
        then:
          additionalProperties: true
          properties:
            unit: {const: min}
    RuleStatus:
      type: string
      enum: [notEvaluated, insufficientData, noAlert, attention, critical]
      description: Rule result independent of freshness. noAlert is not a declaration of health;
        critical asks for urgent verification/crew medical help, not an automatic diagnosis.
    HealthRule:
      type: object
      additionalProperties: false
      required: [ruleId, ruleVersion, metric, title, status, explanation, measurementIds, validUntil,
        suggestedAction, escalation, flightContext, sourceUrls, demonstrationOnly]
      properties:
        ruleId:
          type: string
          minLength: 1
        ruleVersion:
          type: string
          minLength: 1
        metric:
          $ref: '#/components/schemas/Metric'
        title:
          type: string
        status:
          $ref: '#/components/schemas/RuleStatus'
        explanation:
          type: string
          description: Observed value, criterion and interpretation limits; no diagnosis.
        measurementIds:
          type: array
          maxItems: 1
          uniqueItems: true
          items:
            type: string
          description: Exactly one latest-known fresh observation for an evaluated rule; empty otherwise.
        validUntil:
          type: [string, 'null']
          format: date-time
          description: Inclusive measuredAt plus metric freshness window. Null for unevaluated results.
        suggestedAction:
          type: string
        escalation:
          type: string
          enum: [none, self, crew, ground, urgent]
          description: Guidance for the user. No message or medical consultation is sent automatically.
        flightContext:
          type: string
          description: Educational link to flight hazards, not a causal conclusion about this astronaut.
        sourceUrls:
          type: array
          items:
            type: string
            format: uri
          description: Sources for configured rules; may be empty when no rule is configured.
        demonstrationOnly:
          type: boolean
          const: true
    FlightEducation:
      type: object
      additionalProperties: false
      required: [id, title, explanation, suggestedAction, sourceUrls]
