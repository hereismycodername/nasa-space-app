openapi: 3.1.0
info:
  title: Space Health Local API
  version: 0.9.0
  description: 'BE-08 adds explainable demonstration rules while preserving the BE-06 contract. Latest and assessments return independent
    quality for all twelve registered metrics with one server evaluatedAt per response. Explicit demo freshness policies
    are not medical thresholds. History, series, raw measurements and ingestion identity remain unchanged.
    Reads use demo-astronaut. Assessment status/explanation are a deprecated summary of one latest received
    record; new consumers use metrics for quality and health for rule results. Rules are not a validated medical
    device, diagnosis or NASA medical protocol. No authentication, authorization or rate limiting is implemented:
    synthetic data on a trusted local network only, with no 401/403/429 flows. Daily tasks use explicit UTC missionDate and idempotent completion.
    JSON bodies above 2 MiB are rejected. This revision keeps /api paths and ingestion identity,
    extends the metric registry from six to twelve, and retains explicit legacy six-metric response compatibility.'
servers:
- url: http://127.0.0.1:8080
  description: Local Rust server (also serves the built React UI)
security: []
tags:
- name: Health
  description: Server and database readiness.
- name: Measurements
  description: Single-record ingestion, filtered history, independent latest values and bounded aggregated series.
- name: Assessments
  description: Independent data quality, explainable demonstration rules, flight context and suggested actions.
- name: Tasks
  description: Daily checklist for the server-selected demo astronaut and explicit mission date.
paths:
  /api/health:
    get:
      summary: Check API and database readiness
      operationId: getHealth
      tags:
      - Health
      description: Executes a database probe. No authentication or query options.
      responses:
        '200':
          description: API can query SQLite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                ready:
                  externalValue: ./examples/health.response.json
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/DatabaseError'
  /api/measurements:
    get:
      summary: Read a filtered page of measurement history
      operationId: listMeasurements
      tags:
      - Measurements
      description: Returns a page for demo-astronaut, ordered by effective
        UTC milliseconds descending then id descending. Effective time is measuredAt when known, otherwise
        receivedAt; timeBasis identifies the selected field. Sub-millisecond fractions are truncated for
        ordering, while original timestamp strings are preserved. Receipt time does not establish measurement
        freshness. Range is [from,to), with millisecond-aligned bounds and from less than to when both
        are present. Default limit is 100, maximum 500. Pass nextCursor unchanged with the same filters
        to continue below the last returned time/id pair. hasMore is determined by reading one extra row;
        nextCursor is null on the last page. Pages read live data, not a shared snapshot. A late insert
        can appear on a later page. Unknown or repeated query parameters are rejected. A plus sign in
        an offset must be URL-encoded. This envelope replaces the v0.3 array response.
      parameters:
      - name: metric
        in: query
        description: Restrict the page to one supported metric; omit for all metrics.
        schema:
          $ref: '#/components/schemas/Metric'
      - name: from
        in: query
        description: Inclusive effective UTC time, RFC3339 with timezone. Must align to whole milliseconds.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: Exclusive effective UTC time, RFC3339 with timezone. Must align to whole milliseconds.
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: cursor
        in: query
        description: Opaque nextCursor from the previous page. Reuse the same filters; do not parse or construct it.
        schema:
          type: string
          minLength: 1
          maxLength: 160
          x-max-utf8-bytes: 160
      responses:
        '200':
          description: A page of at most limit records, with explicit continuation metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              examples:
                history:
                  externalValue: ./examples/measurements.response.json
                empty:
                  externalValue: ./examples/measurements.empty.response.json
                more:
                  externalValue: ./examples/measurements.page.response.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/DatabaseError'
    post:
      summary: Ingest one measurement
      operationId: createMeasurement
      tags:
      - Measurements
      description: 'Unknown request fields are rejected. Device registration supplies astronautId/source.
        Identity is (deviceId, sessionId, sequence). Equivalent repeats preserve id, receivedAt and the
        original measuredAt text. measuredAt is compared as a UTC instant, so different offsets or
        fractional zero padding do not cause conflicts. Parsing retains the first nine fractional digits;
        finer digits are truncated. Different instants within one millisecond still conflict. Missing
        and null mean the same unknown time; unknown and known time conflict. Leap seconds remain distinct
        from the following ordinary second. Concurrent equivalent requests create one record: one receives
        201 and the others 200; conflicting payloads never overwrite the winner. Database failures return
        500, never a successful save response. Numeric milliseconds are used only for history ordering.
        No batch ingestion. Body limit is 2 MiB.'
      responses:
        '201':
          description: New record inserted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Measurement'
              examples:
                created:
                  externalValue: ./examples/measurement.response.json
                unknownTime:
                  externalValue: ./examples/measurement.unknown-time.response.json
        '200':
          description: Equivalent message already exists; returns its original record, including original timestamp text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Measurement'
              examples:
                repeated:
                  externalValue: ./examples/measurement.response.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/SequenceConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidBody'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/DatabaseError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMeasurement'
            examples:
              knownTime:
                externalValue: ./examples/measurement.request.json
              equivalentRetry:
                summary: Same message and UTC instant as knownTime, with a different offset.
                externalValue: ./examples/measurement.equivalent-retry.request.json
              unknownTime:
                externalValue: ./examples/measurement.unknown-time.request.json
  /api/measurements/latest:
    get:
      summary: Read independent latest values for all twelve metrics
      operationId: getLatestMeasurements
      tags:
      - Measurements
      description: Returns one consistent database snapshot for demo-astronaut with all twelve registered metrics in fixed
        order and one UTC evaluatedAt instant. latestMeasurement uses effective UTC milliseconds descending then
        id descending; latestKnownMeasurement uses known measuredAt in the same order; latestReceivedMeasurement
        uses receipt UTC milliseconds descending then id descending. A late old packet does not replace a newer
        known measurement. All three fields are null when missing. quality evaluates latestKnownMeasurement,
        otherwise latestReceivedMeasurement; latestReceivedQuality independently evaluates latestReceivedMeasurement.
        Future measuredAt is clockSkew, missing measuredAt is unknownTime; receivedAt never replaces measuredAt
        for freshness. Raw measurements remain unchanged. No query parameters are accepted.
      responses:
        '200':
          description: Six metric entries, explicit missing values and independent data quality.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestMeasurements'
              examples:
                knownAndUnknown:
                  externalValue: ./examples/measurements.latest.response.json
                empty:
                  externalValue: ./examples/measurements.latest.empty.response.json
                qualityStates:
                  externalValue: ./examples/measurements.latest.quality.response.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/DatabaseError'
  /api/measurements/series:
    get:
      summary: Read a bounded aggregated series for one metric
      operationId: getMeasurementSeries
      tags:
      - Measurements
      description: >-
        Aggregates every matching measurement for demo-astronaut in [from,to), using measuredAt
        when known and receivedAt otherwise. This is independent of the history page limit.
        Boundaries must be RFC3339 with a timezone, align to whole milliseconds and normalize
        to UTC years 0001 through 9999. Every fractional digit beyond the first three must be zero.
        from must be less than to. There is no fixed duration limit. A plus sign in a query
        offset must be URL-encoded. Buckets are anchored at from in UTC, in ascending order,
        with intervalMs = max(1, ceil((to - from) / maxPoints)). The last bucket ends at to.
        The result has ceil((to - from) / intervalMs) points, at most maxPoints.
        heartRate, systolicPressure, diastolicPressure, temperature, spo2 and glucose use mean with min/max/count.
        sleepHours, mood, visionBlur, exerciseMinutes, headache and backPain use the last value by effective UTC milliseconds descending then id
        descending, with null min/max. count and timeBasis always include every row of the bucket,
        even for last aggregation. Empty intervals have null values and timeBasis, with zero counts;
        a wholly empty range still returns the same bucket grid. No interpolation, carry-forward
        or raw-data changes occur. Unknown or duplicate query fields produce INVALID_QUERY.
        Missing required fields or invalid values produce VALIDATION_ERROR with the relevant field;
        reversed or equal bounds use field to. No cursor or further page is needed.
      parameters:
      - name: metric
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Metric'
      - name: from
        in: query
        required: true
        description: Inclusive effective time; RFC3339, millisecond-aligned, UTC year 0001–9999.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        description: Exclusive effective time, greater than from; same timestamp rules.
        schema:
          type: string
          format: date-time
      - name: maxPoints
        in: query
        description: Maximum response buckets, including empty intervals; does not limit input rows.
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 200
      responses:
        '200':
          description: Whole-range aggregate with one to maxPoints contiguous buckets, including gaps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementSeries'
              examples:
                meanWithGap:
                  externalValue: ./examples/measurements.series.mean.response.json
                last:
                  externalValue: ./examples/measurements.series.last.response.json
                empty:
                  externalValue: ./examples/measurements.series.empty.response.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/DatabaseError'
  /api/assessments:
    get:
      summary: Read data quality and explainable demonstration health rules
      operationId: getAssessment
      tags:
      - Assessments
      description: 'Returns astronautId, one UTC evaluatedAt and quality/latestReceivedQuality for all twelve registered metrics
        using the same domain evaluation as latest. Separate requests can observe different snapshots and times.
        Deprecated status/explanation summarize only the single most recently received record (receipt UTC milliseconds
        descending, then id descending), with that metric''s window: no-data, unknown-time, clock-skew, stale
        or not-evaluated. This is not an overall crew or clinical status. health uses the same snapshot and evaluatedAt,
        with versioned rules, evidence IDs, expiry, actions, escalation and source links. Missing, stale, unknown-time
        or future observations never produce a noAlert result. noAlert means no configured rule fired, not healthy.
        No query parameters
        are accepted; unknown or duplicate keys return 400 INVALID_QUERY.'
      responses:
        '200':
          description: Data quality, demonstration rules and a deprecated single-record summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
              examples:
                empty:
                  externalValue: ./examples/assessment.empty.response.json
                recent:
                  externalValue: ./examples/assessment.recent.response.json
                stale:
                  externalValue: ./examples/assessment.stale.response.json
                unknownTime:
                  externalValue: ./examples/assessment.unknown-time.response.json
                clockSkew:
                  externalValue: ./examples/assessment.clock-skew.response.json
                independentMetrics:
                  externalValue: ./examples/assessment.quality.response.json
                rulesNoAlert:
                  externalValue: ./examples/assessment.rules-normal.response.json
                rulesAttention:
                  externalValue: ./examples/assessment.rules-attention.response.json
                rulesCritical:
                  externalValue: ./examples/assessment.rules-critical.response.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/DatabaseError'
  /api/tasks:
    get:
      summary: List daily tasks for a UTC mission date
      operationId: listTasks
      tags:
      - Tasks
      description: Returns all templates ordered by id ascending with completions for demo-astronaut
        and the requested date. Without date, the server reads today's UTC date once and returns it
        as missionDate. An empty day includes all templates with completedAt null. Unknown and
        repeated query fields are rejected. Invalid dates return 400 VALIDATION_ERROR with field date.
      parameters:
      - name: date
        in: query
        required: false
        description: Canonical calendar date; timestamps and non-padded dates are invalid.
        schema:
          $ref: '#/components/schemas/MissionDate'
        example: '2026-11-13'
      responses:
        '200':
          description: Mission date and its daily checklist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksResponse'
              examples:
                tasks:
                  externalValue: ./examples/tasks.response.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/DatabaseError'
  /api/tasks/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Existing template identifier, such as daily-check.
      schema:
        type: string
    patch:
      summary: Set completion for an explicit mission date
      operationId: updateTask
      tags:
      - Tasks
      description: Requires missionDate and completed. Uses demo-astronaut and actual server UTC time.
        Repeating true preserves the first completedAt; false clears only this day's mark.
        Completing again after cancellation creates a new timestamp. Clients cannot set completedAt
        or astronautId. Invalid or missing missionDate returns 400 VALIDATION_ERROR with field missionDate.
        Missing completed, wrong types and unknown body fields return 400 INVALID_BODY.
        Body limit is 2 MiB.
      responses:
        '200':
          description: Confirmed task with the requested missionDate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskUpdateResponse'
              examples:
                completed:
                  externalValue: ./examples/task.response.json
        '400':
          description: INVALID_JSON, INVALID_BODY, INVALID_PATH or VALIDATION_ERROR. Missing or invalid
            missionDate uses VALIDATION_ERROR with field missionDate.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/DatabaseError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
            examples:
              complete:
                externalValue: ./examples/task-update.request.json

components:
  schemas:
    Metric:
      type: string
      enum:
      - heartRate
      - systolicPressure
      - diastolicPressure
      - temperature
      - sleepHours
      - mood
      - spo2
      - glucose
      - visionBlur
      - exerciseMinutes
      - headache
      - backPain
      description: Twelve supported measurement indicators in registry order. exerciseMinutes records activity
        during the last 24 hours; visionBlur, headache and backPain are self-reported scores.
        Acceptance bounds are not clinical thresholds. The additional six metrics have no BE-08 health rules yet.
    Unit:
      type: string
      enum:
      - bpm
      - mmHg
      - °C
      - h
      - score
      - '%'
      - mg/dL
      - min
      description: heartRate=bpm; systolicPressure/diastolicPressure=mmHg; temperature=°C; sleepHours=h;
        mood/visionBlur/headache/backPain=score; spo2=%; glucose=mg/dL; exerciseMinutes=min.
        A mismatched pair returns VALIDATION_ERROR.
    NewMeasurement:
      type: object
      additionalProperties: false
      required:
      - deviceId
      - sessionId
      - sequence
      - metric
      - value
      - unit
      properties:
        deviceId:
          type: string
          minLength: 1
          maxLength: 128
          description: Registered device ID, 1–128 UTF-8 bytes. Unknown ID produces UNKNOWN_DEVICE.
          x-max-utf8-bytes: 128
        sessionId:
          type: string
          minLength: 1
          maxLength: 128
          description: Device boot/session identifier, 1–128 UTF-8 bytes. Retain on retry; change for
            a new session.
          x-max-utf8-bytes: 128
        sequence:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Monotonic producer message number within this session. Server enforces uniqueness,
            not monotonic arrival order.
        metric:
          $ref: '#/components/schemas/Metric'
        value:
          type: number
          format: double
          description: Finite number, including fractions. >0 for pulse, pressures, temperature and glucose;
            sleepHours in [0,24]; mood in [1,5]; spo2 in [0,100]; visionBlur, headache and backPain in [0,10];
            exerciseMinutes in [0,1440] over the last 24 hours. Zero is allowed for every inclusive interval
            except mood. These are input bounds, not clinical norms.
        unit:
          $ref: '#/components/schemas/Unit'
        measuredAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Optional RFC3339 time of measurement. Missing/null means unknown. Accepted offsets
            are preserved. Cannot be more than five minutes ahead of server time. Retry comparisons use
            the UTC instant with the first nine fractional digits; finer digits are truncated.
      allOf:
      - if:
          properties:
            metric:
              const: heartRate
          required:
          - metric
        then:
          properties:
            unit:
              const: bpm
            value:
              exclusiveMinimum: 0
      - if:
          properties:
            metric:
              const: systolicPressure
          required:
          - metric
        then:
          properties:
            unit:
              const: mmHg
            value:
              exclusiveMinimum: 0
      - if:
          properties:
            metric:
              const: diastolicPressure
          required:
          - metric
        then:
          properties:
            unit:
              const: mmHg
            value:
              exclusiveMinimum: 0
      - if:
          properties:
            metric:
              const: temperature
          required:
          - metric
        then:
          properties:
            unit:
              const: °C
            value:
              exclusiveMinimum: 0
      - if:
          properties:
            metric:
              const: sleepHours
          required:
          - metric
        then:
          properties:
            unit:
              const: h
            value:
              minimum: 0
              maximum: 24
      - if:
          properties:
            metric:
              const: mood
          required:
          - metric
        then:
          properties:
            unit:
              const: score
            value:
              minimum: 1
              maximum: 5
      - if:
          properties:
            metric:
              const: spo2
          required:
          - metric
        then:
          properties:
            unit:
              const: '%'
            value:
              minimum: 0
              maximum: 100
      - if:
          properties:
            metric:
              const: glucose
          required:
          - metric
        then:
          properties:
            unit:
              const: mg/dL
            value:
              exclusiveMinimum: 0
      - if:
          properties:
            metric:
              const: visionBlur
          required:
          - metric
        then:
          properties:
            unit:
              const: score
            value:
              minimum: 0
              maximum: 10
      - if:
          properties:
            metric:
              const: exerciseMinutes
          required:
          - metric
        then:
          properties:
            unit:
              const: min
            value:
              minimum: 0
              maximum: 1440
      - if:
          properties:
            metric:
              const: headache
          required:
          - metric
        then:
          properties:
            unit:
              const: score
            value:
              minimum: 0
              maximum: 10
      - if:
          properties:
            metric:
              const: backPain
          required:
          - metric
        then:
          properties:
            unit:
              const: score
            value:
              minimum: 0
              maximum: 10
    Measurement:
      type: object
      additionalProperties: false
      required:
      - id
      - deviceId
      - astronautId
      - sessionId
      - sequence
      - metric
      - value
      - unit
      - measuredAt
      - receivedAt
      - timeBasis
      - source
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        deviceId:
          type: string
          minLength: 1
          maxLength: 128
          description: Registered device ID, 1–128 UTF-8 bytes. Unknown ID produces UNKNOWN_DEVICE.
          x-max-utf8-bytes: 128
        sessionId:
          type: string
          minLength: 1
          maxLength: 128
          description: Device boot/session identifier, 1–128 UTF-8 bytes. Retain on retry; change for
            a new session.
          x-max-utf8-bytes: 128
        sequence:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Monotonic producer message number within this session. Server enforces uniqueness,
            not monotonic arrival order.
        metric:
          $ref: '#/components/schemas/Metric'
        value:
          type: number
          format: double
          description: Finite number, including fractions. >0 for pulse, pressures, temperature and glucose;
            sleepHours in [0,24]; mood in [1,5]; spo2 in [0,100]; visionBlur, headache and backPain in [0,10];
            exerciseMinutes in [0,1440] over the last 24 hours. Zero is allowed for every inclusive interval
            except mood. These are input bounds, not clinical norms.
        unit:
          $ref: '#/components/schemas/Unit'
        measuredAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Original measurement timestamp text, or null if unknown. Equivalent retries return
            the first stored representation even when the retry uses another offset or fractional padding.
        astronautId:
          type: string
          readOnly: true
          description: Resolved from the registered device by the server.
        receivedAt:
          type: string
          format: date-time
          readOnly: true
          description: Server UTC receipt time of the request that created this record, not commit time. An equivalent retry preserves this value.
        timeBasis:
          type: string
          enum:
          - measuredAt
          - receivedAt
          readOnly: true
          description: Field used to position the record in history. measuredAt when known; receivedAt
            when measuredAt is null. Receipt time does not establish the freshness of a measurement.
        source:
          type: string
          enum:
          - manual
          - simulator
          - sensor
          readOnly: true
          description: Resolved from device registration; never accepted in a request.
      allOf:
      - if:
          properties:
            measuredAt:
              type: 'null'
          required:
          - measuredAt
        then:
          properties:
            timeBasis:
              const: receivedAt
        else:
          properties:
            timeBasis:
              const: measuredAt
      - if:
          properties:
            metric:
              const: heartRate
          required:
          - metric
        then:
          properties:
            unit:
              const: bpm
            value:
              exclusiveMinimum: 0
      - if:
          properties:
            metric:
              const: systolicPressure
          required:
          - metric
        then:
          properties:
            unit:
              const: mmHg
            value:
              exclusiveMinimum: 0
      - if:
          properties:
            metric:
              const: diastolicPressure
          required:
          - metric
        then:
          properties:
            unit:
              const: mmHg
            value:
              exclusiveMinimum: 0
      - if:
          properties:
            metric:
              const: temperature
          required:
          - metric
        then:
          properties:
            unit:
              const: °C
            value:
              exclusiveMinimum: 0
      - if:
          properties:
            metric:
              const: sleepHours
          required:
          - metric
        then:
          properties:
            unit:
              const: h
            value:
              minimum: 0
              maximum: 24
      - if:
          properties:
            metric:
              const: mood
          required:
          - metric
        then:
          properties:
            unit:
              const: score
            value:
              minimum: 1
              maximum: 5
      - if:
          properties:
            metric:
              const: spo2
          required:
          - metric
        then:
          properties:
            unit:
              const: '%'
            value:
              minimum: 0
              maximum: 100
      - if:
          properties:
            metric:
              const: glucose
          required:
          - metric
        then:
          properties:
            unit:
              const: mg/dL
            value:
              exclusiveMinimum: 0
      - if:
          properties:
            metric:
              const: visionBlur
          required:
          - metric
        then:
          properties:
            unit:
              const: score
            value:
              minimum: 0
              maximum: 10
      - if:
          properties:
            metric:
              const: exerciseMinutes
          required:
          - metric
        then:
          properties:
            unit:
              const: min
            value:
              minimum: 0
              maximum: 1440
      - if:
          properties:
            metric:
              const: headache
          required:
          - metric
        then:
          properties:
            unit:
              const: score
            value:
              minimum: 0
              maximum: 10
      - if:
