        evaluatedMetricCount, totalMetricCount, rules, education]
      properties:
        ruleSetVersion:
          type: string
          example: be08-demo-1
        demonstrationOnly:
          type: boolean
          const: true
        status:
          $ref: '#/components/schemas/RuleStatus'
        explanation:
          type: string
        disclaimer:
          type: string
        emergencyGuidance:
          type: string
          description: Symptoms needing crew assistance independently of readings or connectivity.
        evaluatedMetricCount:
          type: integer
          minimum: 0
          maximum: 12
        totalMetricCount:
          type: integer
          enum: [6, 12]
          description: Twelve on current servers; six is retained for pre-extension BE-08 responses.
        rules:
          type: array
          oneOf:
          - title: Current twelve-metric rules
            minItems: 12
            maxItems: 12
          - title: Legacy six-metric rules
            minItems: 6
            maxItems: 6
            items:
              properties:
                metric:
                  enum: [heartRate, systolicPressure, diastolicPressure, temperature, sleepHours, mood]
          items:
            $ref: '#/components/schemas/HealthRule'
          description: One result per registered metric, in registry order. spo2, glucose, visionBlur, exerciseMinutes,
            headache and backPain currently remain notEvaluated even with fresh readings; no clinical rules
            are defined for these metrics. Six-rule arrays describe pre-extension responses only.
        education:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: '#/components/schemas/FlightEducation'
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      - storage
      properties:
        status:
          type: string
          const: ok
        storage:
          type: string
          const: sqlite
    Assessment:
      type: object
      additionalProperties: false
      required:
      - status
      - explanation
      - astronautId
      - evaluatedAt
      - metrics
      properties:
        status:
          type: string
          enum:
          - no-data
          - unknown-time
          - stale
          - not-evaluated
          - clock-skew
          deprecated: true
          description: Single most recently received record only. not-evaluated means that record is fresh.
            Preserved compatibility field; use health for BE-08 rules. Never an overall health status.
        explanation:
          type: string
          deprecated: true
          description: Explanation of the same single-record compatibility status.
        astronautId:
          type: string
          const: demo-astronaut
        evaluatedAt:
          type: string
          format: date-time
          description: One server UTC RFC3339 instant for every quality calculation in this response.
        metrics:
          type: array
          oneOf:
          - title: Current twelve-metric registry
            minItems: 12
            maxItems: 12
          - title: Legacy six-metric registry
            minItems: 6
            maxItems: 6
            items:
              properties:
                metric:
                  enum: [heartRate, systolicPressure, diastolicPressure, temperature, sleepHours, mood]
          description: Current servers return twelve metrics in fixed registry order heartRate, systolicPressure,
            diastolicPressure, temperature, sleepHours, mood, spo2, glucose, visionBlur, exerciseMinutes, headache,
            backPain. The six-item alternative documents older servers and retained legacy examples only;
            it contains the original first six metrics. Clients discover supported metrics from this response.
