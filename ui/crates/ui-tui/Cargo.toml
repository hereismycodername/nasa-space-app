[package]
name = "ui-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AstroCheck terminal interface (works over SSH / serial console / on boards without a display)"

[lib]
name = "ui_tui"
path = "src/lib.rs"

[[bin]]
name = "astrocheck-tui"
path = "src/main.rs"

[dependencies]
ui-model = { path = "../ui-model" }
ui-http = { path = "../ui-http" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }

[dev-dependencies]
serde_json = "1"
