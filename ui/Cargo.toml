[workspace]
resolver = "2"
members = ["crates/ui-model", "crates/ui-tui", "crates/ui-gui"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

# Small and fast on single-board computers.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
